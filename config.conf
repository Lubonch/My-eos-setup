# Configuración del setup
# Editá este archivo para personalizar qué se instala

# Nombre de usuario para los dotfiles
SETUP_USER="$USER"

# Categorías a instalar por defecto (separadas por coma)
# Opciones: system,gaming,gamedev,dev,browsers,comms,vpn,media,util,desktop,fonts
DEFAULT_CATEGORIES="system,gaming,gamedev,dev,browsers,comms,vpn,media,util,desktop,fonts"

# Si es "true", copia los dotfiles al home
COPY_DOTFILES=true

# Si es "true", instala yay si no existe
INSTALL_YAY=true

# Si es "true", muestra paquetes antes de instalar
DRY_RUN=false
