# picom - compositor para i3 (ricing sobrio, transparencias sutiles)

backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.25;
shadow-offset-x = -8;
shadow-offset-y = -8;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

inactive-opacity = 0.96;
active-opacity = 1.0;

# No romper juegos/benchmarks fullscreen
unredir-if-possible = true;
mark-ovredir-focused = true;

opacity-rule = [
  "100:class_g = 'picom'",
];