# ============================================================
# Perfil benchmark - ISO liviana con tiling WM (i3) y
# herramientas de benchmarking / stress testing
# ============================================================

PROFILE_NAME="benchmark"

AUR_PACKAGES=(
    geekbench
    unigine-superposition
    phoronix-test-suite
    gputest
    basemark
    blender-benchmark-bin
)

PACKMAN_EXTRAS='# CUSTOM SETUP - Benchmark

## Benchmarking
glmark2
sysbench
stress-ng
7zip
hardinfo2
vkmark

## GPU monitoring / benchmarks
mangohud
nvtop
mesa-utils

## Tiling WM (i3)
i3-wm
i3status
dmenu
xorg-xinit
xcape
xterm

## Ricing sobrio
picom
rofi
feh

## Hardware info
cpufetch
btop
openssl'

# ============================================================
# Hook de patchs específicos del perfil (se corre dentro de
# clone_and_patch, con cwd = dir del repo clonado)
# ============================================================
configure_profile() {
    log "Perfil benchmark: quitando KDE, configurando i3..."

    # 1. Sacar la sección "Desktop environment" de packages.x86_64 (incluye
    #    sddm/plasma/kwin). Se borra desde el header "## Desktop environment"
    #    hasta el siguiente header "## Browser".
    awk '
        /^## Desktop environment$/ { skip=1; next }
        skip && /^## /              { skip=0 }
        !skip { print }
    ' packages.x86_64 > packages.x86_64.tmp && mv packages.x86_64.tmp packages.x86_64
    grep -q "plasma-desktop" packages.x86_64 && warn "  [!] KDE no se removió correctamente"

    # 2. Dotfiles del ricing (i3 + picom) hacia /etc/skel del live.
    log "Agregando config de i3/picom (ricing sobrio)..."
    mkdir -p airootfs/etc/skel/.config/i3 airootfs/etc/skel/.config
    cp "$BASE_DIR/dotfiles/i3/config" airootfs/etc/skel/.config/i3/config 2>/dev/null || warn "  [!] No se copió i3/config"
    cp "$BASE_DIR/dotfiles/picom.conf" airootfs/etc/skel/.config/picom.conf 2>/dev/null || warn "  [!] No se copió picom.conf"

    # 3. Nuestro .xinitrc para i3, guardado en /root/ del live (sobrevive la
    #    instalación del paquete endeavoursouros-skel-liveuser que trae el de Plasma).
    mkdir -p airootfs/etc/skel airootfs/root
    cat > airootfs/root/benchmark-xinitrc <<'EOF'
#!/bin/sh
export XDG_SESSION_TYPE=x11
export XDG_CURRENT_DESKTOP=i3
export GDK_BACKEND=x11
exec i3
EOF
    chmod +x airootfs/root/benchmark-xinitrc
    grep -q 'exec i3' airootfs/root/benchmark-xinitrc || err "  [!] .xinitrc i3 mal generado"

    # 4. Instalar el .xinitrc i3 en el liveuser DESPUÉS de useradd -m (que copia
    #    el skel, incluyendo el .xinitrc de Plasma del paquete).
    sed -i '/^useradd -m -p ""/a cp "/root/benchmark-xinitrc" "/home/liveuser/.xinitrc"\nchown liveuser:liveuser "/home/liveuser/.xinitrc"' run_before_squashfs.sh

    # 5. También para el system instalado: el skel final (offline target) y el
    #    skel default en /etc/skel apuntan a i3.
    sed -i 's|^cp -af "/root/filebackups/"{"\.bashrc",".bash_profile"} "/etc/skel/"$|cp -af "/root/filebackups/"{".bashrc",".bash_profile"} "/etc/skel/"\ncp "/root/benchmark-xinitrc" "/etc/skel/.xinitrc"|' run_before_squashfs.sh
}